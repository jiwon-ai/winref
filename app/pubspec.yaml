name: winref
description: WINREF ACADEMY 스포츠 인재은행
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  supabase_flutter: ^2.5.0
  file_picker: ^13.3.2
  url_launcher: ^6.2.0
  intl: any
  web: any
  webview_flutter: ^4.10.0
  pdf: ^3.11.0
  printing: ^5.13.0
  firebase_core: ^3.0.0
  firebase_messaging: ^15.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
  # Pretendard (SIL OFL 1.1, assets/fonts/Pretendard-LICENSE.txt) — KS X 1001 한글 2350자 서브셋
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.otf
        - asset: assets/fonts/Pretendard-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.otf
          weight: 700
