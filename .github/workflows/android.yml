name: Android & Admin Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 최초 1회: 플랫폼 폴더(android/web) 생성 후 저장소에 커밋
      - name: Bootstrap platform folders
        if: hashFiles('app/android/app/src/main/AndroidManifest.xml') == ''
        run: |
          flutter create . --platforms=android,web --org kr.co.winref --project-name winref
          rm -f test/widget_test.dart
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .
          git commit -m "chore: generate android/web platform folders"
          git push

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos

      - name: Release keystore (Secrets 가 있을 때만)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build
        env:
          DEFINES: >-
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL || 'https://oxdavtdvpwhcllnivizb.supabase.co' }}
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY || 'sb_publishable_n_LETmj8ZhCjOIZ5NfD5BA_afhksSoS' }}
            --dart-define=FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}
            --dart-define=FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID }}
            --dart-define=FIREBASE_SENDER_ID=${{ secrets.FIREBASE_SENDER_ID }}
            --dart-define=FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          flutter build apk --release $DEFINES
          flutter build appbundle --release $DEFINES
          flutter build web --release --base-href /winref/ $DEFINES

      - uses: actions/upload-artifact@v4
        with:
          name: winref-android
          path: |
            app/build/app/outputs/flutter-apk/app-release.apk
            app/build/app/outputs/bundle/release/app-release.aab

      - uses: actions/upload-artifact@v4
        with:
          name: winref-admin-web
          path: app/build/web

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/build/web

  # 고객 시연용 웹 주소: https://jiwon-ai.github.io/winref/
  # 저장소 Settings > Pages > Source 를 "GitHub Actions" 로 한 번 설정해야 배포된다.
  pages:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true   # Pages 미설정 상태에서 빌드 전체가 실패로 표시되지 않게
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
