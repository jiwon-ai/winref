name: E2E (local Supabase + browser)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  db-policies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: RLS·권한 단위 테스트 (PGlite)
        run: |
          cat supabase/migrations/*.sql > /tmp/all.sql
          cd supabase/tests && npm init -y > /dev/null && npm i @electric-sql/pglite > /dev/null
          node policies.test.mjs /tmp/all.sql

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Start local Supabase
        run: |
          mkdir -p /tmp/sb && cd /tmp/sb
          supabase init
          sed -i -E 's/= 543([0-9]{2})/= 553\1/' supabase/config.toml   # 러너 기본 포트 충돌 회피
          grep -nE "^port = 553" supabase/config.toml | head
          for i in 1 2 3; do   # 러너 포트 충돌이 간헐적으로 나서 재시도
            supabase start -x studio,imgproxy,logflare,vector,supavisor && break
            supabase stop --no-backup || true; sleep 10
          done
          supabase status > /dev/null
          supabase status -o env | sed 's/^/export /' > /tmp/sb/env.sh
          cat /tmp/sb/env.sh | grep -E "API_URL|DB_URL"

      - name: Apply migrations, users, seed
        run: |
          source /tmp/sb/env.sh
          for f in supabase/migrations/*.sql; do echo "== $f"; psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f "$f"; done
          mk() {
            curl -sf -X POST "$API_URL/auth/v1/admin/users" \
              -H "apikey: $SERVICE_ROLE_KEY" -H "Authorization: Bearer $SERVICE_ROLE_KEY" -H "Content-Type: application/json" \
              -d "{\"email\":\"$1\",\"password\":\"Test1234!\",\"email_confirm\":true,\"user_metadata\":$2}" > /dev/null
          }
          mk admin@test.kr '{"name":"관리자"}'
          mk org@test.kr '{"name":"박관계","role":"organizer","organization":"서울시축구협회"}'
          mk ref2@test.kr '{"name":"이심판"}'
          mk ref3@test.kr '{"name":"박심판"}'
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f e2e/seed.sql
          psql "$DB_URL" -c "select role, name, org_status from profiles"

      - name: Build web (E2E)
        working-directory: app
        run: |
          source /tmp/sb/env.sh
          flutter pub get
          flutter build web --release --dart-define=E2E=true \
            --dart-define=SUPABASE_URL=$API_URL --dart-define=SUPABASE_ANON_KEY=$ANON_KEY

      - name: Run browser scenarios
        run: |
          source /tmp/sb/env.sh
          (cd app/build/web && python3 -m http.server 8080 > /dev/null 2>&1 &)
          cd e2e
          npm init -y > /dev/null
          npm i playwright@1 > /dev/null
          npx playwright install --with-deps chromium > /dev/null
          APP_URL=http://127.0.0.1:8080 DB_URL="$DB_URL" node run.mjs

      - name: Publish screenshots to e2e-shots branch
        if: always()
        run: |
          mkdir -p /tmp/shots && cp e2e/shots/*.png /tmp/shots/ || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan e2e-shots
          git rm -rq --cached . && git clean -fdq -e e2e/node_modules
          cp /tmp/shots/*.png . && git add *.png
          git commit -qm "E2E screenshots ${GITHUB_SHA::7}" && git push -fq origin e2e-shots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: e2e/shots
